[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026"
version = "0.1.0"
requires-python = ">=3.11"

# CỐ Ý KHÔNG khai [project.dependencies].
# Thư viện và phiên bản do requirements.txt + constraints.txt quản.
# Khai ở hai nơi là tự tạo ra hai nguồn sự thật, rồi có ngày lệch nhau.

[tool.setuptools.packages.find]
where = ["src"]

# CỐ Ý KHÔNG khai [tool.pytest.ini_options].
# Repo đã có pytest.ini, và pytest.ini thắng pyproject.toml về thứ tự
# ưu tiên. Để cả hai là có một khối cấu hình chết mà người sau sẽ sửa
# rồi tưởng đã có tác dụng.
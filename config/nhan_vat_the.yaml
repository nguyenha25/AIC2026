# Việc 3 — TỪ TIẾNG VIỆT TRONG ĐỀ  ->  NHÃN TIẾNG ANH CỦA raw/objects/
#
# Nhãn bên phải là detection_class_entities do Faster R-CNN (bộ nhãn Open
# Images) sinh ra. Viết ĐÚNG chính tả và ĐÚNG hoa/thường như trong tệp JSON,
# vì FTS5 khớp theo chuỗi.
#
# Cách thêm nhãn mới (2 phút):
#   python -m scripts.build_objects_index --liet-ke-nhan
# In ra 100 nhãn hay gặp nhất trong kho. Thấy nhãn nào chưa có ở đây thì thêm.
#
# Một từ tiếng Việt được phép trỏ tới NHIỀU nhãn: "xe" gom cả ô tô lẫn xe tải.
# Khoá so khớp đã hạ chữ thường và bỏ dấu bằng Python trước khi tra, nên viết
# có dấu ở đây là được, không cần viết thêm bản không dấu.


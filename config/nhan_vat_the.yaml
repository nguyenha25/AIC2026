# ---------------------------------------------------------------------------
# CỤM PHẢI GẠCH ĐI TRƯỚC KHI TRA NHÃN
# ---------------------------------------------------------------------------
# Đây là các cụm ghép mà một từ bên trong CÓ trong bảng trên, nhưng cả cụm thì
# KHÔNG nói về vật thể đó. Ranh giới từ không cứu được, vì "nhà" trong "trong
# nhà" đúng là một từ trọn vẹn — chỉ có cách gạch cả cụm đi.
#
# Phát hiện từ lần chạy thật đầu tiên trên 873 video: câu "một cảnh quay TRONG
# NHÀ lúc trời mưa" trả về toàn ảnh có ngôi nhà, trong khi ý người hỏi là bối
# cảnh trong nhà.
#
# Thêm cụm mới vào đây khi thấy nhánh vật thể trả kết quả lạc đề.

bo_qua:
  # nhà
  - trong nhà
  - ở nhà
  - về nhà
  - cả nhà
  - nhà báo
  - nhà hàng
  - nhà nước
  - nhà máy
  - nhà trường
  - nhà khoa học
  - nhà thơ
  - nhà văn
  - nhà đầu tư
  - nhà tài trợ
  - nhà lãnh đạo
  # cửa
  - cửa hàng
  - cửa khẩu
  - cửa ngõ
  # kéo, dao — động từ
  - kéo dài
  - kéo theo
  - lôi kéo
  - kéo đến
  - dao động
  # kính ngữ
  - kính thưa
  - kính chào
  - kính trọng
  - kính mời
  # sách
  - chính sách
  - kế sách
  - sách lược
  # bàn — động từ
  - bàn giao
  - bàn bạc
  - bàn luận
  - bàn về
  # cây
  - cây cầu
  - cây số
  - cây xăng
  # cá, cam, bóng, ly, cờ, ô, hoa
  - cá nhân
  - cá tính
  - cam kết
  - cam go
  - bóng dáng
  - bóng tối
  - ly hôn
  - cờ bạc
  - ô nhiễm
  - hoa hậu

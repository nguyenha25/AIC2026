# Tham số chạy. Đổi ở đây, KHÔNG sửa số trực tiếp trong mã nguồn.
# Mỗi lần chạy chép tệp này vào runs/<tên lần chạy>/ để sau còn biết
# lần đó chạy với tham số gì.

nop_bai:
  so_dong_toi_da: 100        # BTC cho tối đa 100 câu trả lời một truy vấn
  bo_trung: true             # bắt buộc: trùng chỉ ăn điểm một lần
  so_moc_trake: 4            # số khoảnh khắc mặc định của một truy vấn TRAKE

tra_cuu:
  so_ung_vien_moi_nguon: 500 # lấy dư rồi mới gộp và lọc, không lấy đúng 100
  do_do: cosine
  mo_hinh_nen: clip-ViT-B-32 # BTC phát sẵn. Giai đoạn 2 nâng lên SigLIP 2

  # NHÁNH MÃ HOÁ CÂU CHỮ. Vector ảnh KHÔNG đổi ở bất cứ lựa chọn nào.
  #   da_ngu  clip-ViT-B-32-multilingual-v1. Hiểu tiếng Việt. Không cần cài
  #           thêm gói. Nhanh hơn nhánh gốc (14 ms so với 37 ms mỗi câu).
  #   dich    Dịch Việt→Anh rồi vào encoder gốc. Người ngồi máy đọc và sửa
  #           được bản dịch. Cần tải thêm mô hình dịch ~900 MB.
  #   goc     Đưa thẳng vào encoder gốc. CHỈ dùng cho câu tiếng Anh.
  #           Với tiếng Việt đây là mốc sàn để so, không phải phương án.
  #
  # Đo trên bộ câu hỏi tiếng Việt của nhóm: da_ngu hơn goc 0,133 điểm theo
  # công thức Việc 12.
  #
  # Đổi nhanh mà không sửa tệp:  $env:AIC_NHANH_CHU = "dich"
  nhanh_ma_hoa_chu: da_ngu

# ---------------------------------------------------------------------------
# Việc 4 — xếp hạng lại top-100 bằng mô hình mạnh hơn
# ---------------------------------------------------------------------------
rerank:
  mo_hinh: ViT-L-14
  pretrained: laion2b_s32b_b82k
  # thiet_bi: cpu        # bỏ trống thì tự chọn cuda nếu có
  so_dau: 100
  cach_gop: thay         # thay | rrf — đo cả hai trên dev v2 rồi hãy chốt

# ---------------------------------------------------------------------------
# Việc 5 — mở rộng truy vấn Việt -> Anh. CHỈ áp cho nhánh CLIP.
# ---------------------------------------------------------------------------
mo_rong_truy_van:
  # tu_dien  tra bảng, offline, tất định — mốc sàn để so
  # marian   dùng lại nhánh "dich" của clip_encoder
  # llm      gọi mô hình ngôn ngữ, cần ANTHROPIC_API_KEY trong .env
  nguon: tu_dien
  toi_da_bien_the: 2

gop_ket_qua:
  cach_gop: rrf              # Reciprocal Rank Fusion
  rrf_k: 60
  # Đây là bộ KHỞI ĐẦU. Việc 6 quét lưới trên dev v2 rồi ghi bộ đã đo vào
  # config/rrf_weights.yaml; rank/config.trong_so_theo_dang() ưu tiên tệp đó.
  trong_so:
    clip: 1.0
    ocr: 0.6
    ocr_fts: 0.6
    asr: 0.6
    object: 0.4
    caption: 0.5

loc_trung:
  # Luật chốt Việc 4: mỗi video tối đa MỘT kết quả trong mỗi cửa sổ 10 giây,
  # tính theo cột giây của bảng đối chiếu. Không tính theo khung hình —
  # fps mỗi video một khác (đo thật: L21_V001 là 30fps, L21_V003 là 25fps),
  # nên cùng một con số khung hình sẽ ra cửa sổ dài ngắn khác nhau.
  cua_so_giay: 10.0

duong_dan:
  # Để trống — mọi đường dẫn lấy từ src/aic2026/paths.py.
  # Mục này chỉ để nhắc: KHÔNG viết đường dẫn vào tệp cấu hình.

cham_diem:
  # Task 12. So khớp ngữ nghĩa answer (hoi_dap) bằng độ tương đồng cosine
  # giữa hai vector embedding câu (sentence-transformers, chạy LOCAL, KHÔNG
  # gọi API trả phí). Ngưỡng dưới đây: >= thì coi là khớp ngữ nghĩa.
  # ĐÂY LÀ QUYẾT ĐỊNH CẦN CẢ NHÓM XÁC NHẬN — xem docs/decisions/002-...md.
  nguong_tuong_dong_qa: 0.80